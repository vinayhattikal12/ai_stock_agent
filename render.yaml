services:
  - type: web
    name: ai-stock-backend
    runtime: python
    region: singapore # or oregon, frankfurt, etc.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: UPSTOX_ACCESS_TOKEN
        sync: false # Set securely in Render dashboard
